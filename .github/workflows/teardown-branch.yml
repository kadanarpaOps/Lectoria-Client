name: Teardown
on:
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  teardown:
    name: Teardown Frontend from VPS
    runs-on: ubuntu-latest

    steps:
      - name: Resolve Repository Name & Domain
        id: resolve
        shell: bash
        env:
          REPO: ${{ github.event.repository.name }}
          DOMAIN: ${{ secrets.HOSTINGER_MAIN_DNS }}
        run: |
          {
            echo "repository-name=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
            echo "fqdn=$DOMAIN"
          } >> "$GITHUB_OUTPUT"

      # The DNS record is intentionally NOT removed: the domain is the fixed main one.
      - name: SSH and Teardown
        uses: appleboy/ssh-action@v1
        env:
          REPOSITORY_NAME: ${{ steps.resolve.outputs.repository-name }}
          FQDN: ${{ steps.resolve.outputs.fqdn }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          envs: REPOSITORY_NAME,FQDN
          script: |
            set -e
            PROJECT_DIR="$HOME/projects/${REPOSITORY_NAME}/main"
            CONF_NAME="${REPOSITORY_NAME}.main.conf"

            echo "=== 1. Stop & remove container ==="
            if [ -f "${PROJECT_DIR}/docker-compose.yml" ]; then
              cd "$PROJECT_DIR"
              docker compose down --rmi all --volumes --remove-orphans \
                || echo "WARNING: docker compose down failed or nothing running."
              cd "$HOME"
            else
              echo "No docker-compose.yml found, nothing to stop."
            fi

            echo "=== 2. Unlink & remove nginx config ==="
            sudo rm -f "/etc/nginx/sites-enabled/${CONF_NAME}"
            sudo rm -f "/etc/nginx/sites-available/${CONF_NAME}"
            sudo nginx -t && sudo systemctl reload nginx || echo "WARNING: nginx reload failed, check manually."

            echo "=== 3. Remove certbot certificate ==="
            if sudo test -d "/etc/letsencrypt/live/${FQDN}"; then
              sudo certbot delete --cert-name "${FQDN}" --non-interactive || echo "WARNING: certbot delete failed."
            else
              echo "No certificate found for ${FQDN}, skipping."
            fi

            echo "=== 4. Remove project folder ==="
            rm -rf "$PROJECT_DIR"
            rmdir "$HOME/projects/${REPOSITORY_NAME}" 2>/dev/null || true

            echo "SUCCESS: Teardown complete for ${REPOSITORY_NAME}"