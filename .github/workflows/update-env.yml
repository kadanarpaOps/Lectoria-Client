name: Build Docker Image
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Docker Repository Name
        id: docker-repo
        shell: bash
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          echo "name=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Push to main -> publish :latest | PR to main -> build only (validates, does not touch :latest)
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ github.event_name == 'push' && format('{0}/{1}:latest', secrets.DOCKERHUB_USERNAME, steps.docker-repo.outputs.name) || format('{0}:pr-check', steps.docker-repo.outputs.name) }}
          cache-from: type=gha
          cache-to: type=gha,mode=maxSolo pide el json de .env