name: Update ENV
on:
  workflow_dispatch:
    inputs:
      env-vars:
        required: true
        description: 'Variables in JSON format (e.g. {"VITE_API_URL": "https://api.example.com"})'
        type: string

jobs:
  update-env:
    name: Update Environment Variables
    uses: kadanarpaOps/Ops-Github-Workflows/.github/workflows/update-env.yml@main
    with:
      target-branch: main
      env-vars: ${{ inputs.env-vars }}
    secrets:
      VPS_IP: ${{ secrets.VPS_IP }}
      VPS_PRIVATE_KEY: ${{ secrets.VPS_PRIVATE_KEY }}
      VPS_USERNAME: ${{ secrets.VPS_USERNAME }}